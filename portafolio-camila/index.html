<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portafolio de Análisis de Datos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5ff;--card:#fff;--tx:#1c1b3a;--mu:#6c6a8a;--ac:#6d4aff;--bd:#e7e4fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d22;--card:#17153a;--tx:#eeecff;--mu:#a09dc7;--ac:#9b85ff;--bd:#2a2760}}
:root[data-theme="dark"]{--bg:#0e0d22;--card:#17153a;--tx:#eeecff;--mu:#a09dc7;--ac:#9b85ff;--bd:#2a2760}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Plus Jakarta Sans",Inter,system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.15}.c{max-width:1080px;margin:0 auto;padding:0 24px}.mu{color:var(--mu)}small{color:var(--mu);font-size:13px}
.nav{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;color:#fff;flex-wrap:wrap;gap:10px}
.post~footer,.nav+.post{}.brand{display:flex;gap:10px;align-items:center;cursor:pointer}.brand b{display:block;font-size:18px;line-height:1.1}.brand small{color:#c9c2ff}
.nav nav{display:flex;gap:6px;align-items:center}.nav a{padding:8px 16px;border-radius:99px;cursor:pointer;font-size:14px;color:#fff}.nav a:hover,.nav a.pill{background:#6d4aff}
.hero{background:radial-gradient(1200px 500px at 80% 20%,#3b25a8 0,transparent 60%),linear-gradient(135deg,#0b0926,#1d1160 60%,#2a1a7a);color:#fff;padding:130px 0 90px;border-radius:0 0 50% 50%/0 0 40px 40px}
.hg{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}@media(max-width:760px){.hg{grid-template-columns:1fr}.ph{order:-1}}
.hi{font-size:26px;color:#d9d4ff}.hero h1{font-size:clamp(40px,7vw,70px);font-weight:800}.hero h1 span{background:linear-gradient(90deg,#8b5cf6,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.rl{display:flex;gap:10px;align-items:center;font-size:26px;font-weight:700;margin:12px 0}.hero p{color:#d9d4ff;font-size:18px;max-width:460px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.hp{display:inline-flex;align-items:center;padding:11px 20px;border-radius:99px;background:rgba(109,74,255,.45);border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;font-size:14px;font-weight:600;cursor:pointer}
.ph{position:relative;display:grid;place-items:center}.ph img,.ini{width:min(320px,70vw);aspect-ratio:1;border-radius:50%;object-fit:cover;border:4px solid rgba(139,92,246,.6);box-shadow:0 0 60px rgba(109,74,255,.5)}
.ini{display:grid;place-items:center;font-size:90px;font-weight:800;background:linear-gradient(135deg,#4c2fd0,#8b5cf6)}.chg{position:absolute;bottom:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:-40px;position:relative}@media(max-width:700px){.two{grid-template-columns:1fr}}
.ib{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(80,60,200,.08)}.ib h3{font-size:20px;margin-bottom:6px}
.big{display:block;font-size:30px;color:var(--ac);margin-bottom:8px}.ln{margin-top:8px}.ln b{display:block;font-size:15px}.ed{font-size:18px!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.ph2{margin:56px 0 20px}.ph2 h2,.post h1{font-size:clamp(28px,4vw,38px);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;cursor:pointer;transition:.2s}.pc:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(80,60,200,.16)}
.th2{aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#1d1160,#6d4aff)}.th2 img{width:100%;height:100%;object-fit:cover;display:block}
.pc .row{margin:14px 0 4px;flex-wrap:nowrap}.pc h3{font-size:19px}.pc p{color:var(--mu);margin:0 0 10px;font-size:14.5px}.ex{color:var(--mu);display:grid;place-items:center}.ex:hover{color:var(--ac)}
.tag{display:inline-block;font-size:12px;padding:3px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mu);margin:0 6px 6px 0}.tag.lg{color:var(--ac);font-weight:600}
button,.btn{font:inherit;font-size:14px;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
footer{background:linear-gradient(135deg,#0b0926,#1d1160);color:#fff;margin-top:70px;padding:26px 0}.fr{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.fl{display:flex;gap:20px;flex-wrap:wrap}.fl a{color:#d9d4ff;text-decoration:none;font-size:14px}footer small{color:#a09dc7}
.post{padding-top:96px}.bar{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:14px 0;flex-wrap:wrap}.post article{max-width:760px}.post h1{margin:10px 0 12px}.post .s{font-size:19px;color:var(--mu)}.post h2{font-size:26px;margin:30px 0 8px}
.lang{font-size:14px;color:var(--mu);margin:14px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lang button{padding:4px 12px;font-size:13px}.links{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
figure{margin:26px 0}figure img{width:100%;border-radius:14px;border:1px solid var(--bd)}figcaption{color:var(--mu);font-size:14px;margin-top:6px}
.panel{display:grid;grid-template-columns:230px 1fr;min-height:100vh}@media(max-width:800px){.panel{grid-template-columns:1fr}}
.panel aside{background:var(--card);border-right:1px solid var(--bd);padding:22px 14px;display:flex;flex-direction:column;gap:6px}.panel aside .brand{margin-bottom:18px;color:var(--tx)}.panel aside .brand small{color:var(--mu)}
.panel aside a{padding:11px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:500}.panel aside a:hover,.panel aside a.on{background:var(--bg);color:var(--ac)}
.panel main{padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}.welcome{background:linear-gradient(135deg,#e9e4ff,#d8ceff);color:#1c1b3a;border-radius:20px;padding:26px}.welcome h2{font-size:28px}.welcome p{margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.st,.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}.st b{display:block;font-size:30px}
.box h3{font-size:19px}.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd);flex-wrap:wrap;margin-top:10px}.lt{width:70px;height:50px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#1d1160,#6d4aff)}.lt img{width:100%;height:100%;object-fit:cover}
.lb{flex:1;min-width:140px}.lb b{display:block}.li button{padding:6px 12px;font-size:13px}.dn{display:flex;gap:26px;align-items:center;margin-top:14px;flex-wrap:wrap}.ring{width:130px;height:130px;border-radius:50%;-webkit-mask:radial-gradient(circle 38px,transparent 98%,#000 100%);mask:radial-gradient(circle 38px,transparent 98%,#000 100%)}.dn i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);width:min(640px,94vw);padding:22px;max-height:92vh}dialog::backdrop{background:rgba(0,0,0,.55)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}textarea{min-height:110px}
.blk{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:10px}.blk img{max-width:100%;max-height:160px;border-radius:8px;display:block;margin-bottom:6px}.ctl{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}.ctl button{padding:2px 10px}
.empty{color:var(--mu);padding:36px 0}
</style></head><body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script type="application/json" id="data">{"profile": {"name": "Camila Guerra", "tagline": "Analista de Datos & BI | Power BI · SQL · Python · ETL | Desarrolladora Full Stack", "linkedin": "https://www.linkedin.com/in/danna-camila-guerra-rincon-7588141b1/", "email": "dcamilaguerra@gmail.com", "exp": [{"role": "Desarrolladora Web y Coordinadora de Tableros Power BI", "org": "Previsora Seguros S.A.", "place": "Bogotá", "when": "Jun 2025 – Dic 2025", "items": [], "skills": []}, {"role": "Desarrolladora Full Stack", "org": "Private Investigation Technology", "place": "Bogotá", "when": "Feb 2024 – May 2025", "items": [], "skills": []}, {"role": "Desarrolladora Front-end y Backend junior", "org": "SENNOVA – Centro de Tecnologías del Transporte", "place": "Bogotá", "when": "Oct 2023 – Ene 2025", "items": [], "skills": []}], "edu": [{"title": "Ingeniera en Ciencia de Datos", "org": "Corporación Universitaria Iberoamericana", "when": "2026", "skills": []}], "role": "Analista de Datos", "lead": "Transformo datos en información valiosa para tomar mejores decisiones."}, "posts": [{"id": "pmwj24vc7", "title": "prueba", "summary": "prueba", "tags": ["sql"], "links": [], "blocks": [{"t": "text", "v": "asdfghjklñpo9iujhnbmkoiuhbnmkijhn"}, {"t": "img", "v": "/_blob/36c2da543b0d018b9f44f90b0a800848", "cap": ""}], "lang": "es"}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
let sampleApi=null,owner=false,assetsApi=null,pubApi=null,busy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const body=t=>esc(t).split(/\n{2,}/).map(p=>p.startsWith('## ')?`<h2>${p.slice(3)}</h2>`:`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
const safeUrl=u=>/^https?:\/\//i.test(u)?u:'#';
function ymd(){return ''}
const lang=l=>l==='en'?'Escrito en inglés':'Escrito en español';
let tr=null,showTr=false;
function blocksHtml(p,t){
  const bl=p.blocks||[{t:'text',v:p.body||''}];
  return bl.map((b,i)=>b.t==='img'?`<figure><img loading="lazy" src="${esc(b.v)}" alt="">${b.cap?`<figcaption>${esc(b.cap)}</figcaption>`:''}</figure>`:body(t?t.blocks[i]??b.v:b.v)).join('');
}
const logo='<svg width="30" height="30" viewBox="0 0 30 30"><rect x="2" y="14" width="7" height="14" rx="2" fill="#a78bfa"/><rect x="11.5" y="7" width="7" height="21" rx="2" fill="#8b5cf6"/><rect x="21" y="2" width="7" height="26" rx="2" fill="#6d4aff"/></svg>';
const ext='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
function go(id){const f=()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth'});if(location.hash){location.hash='';setTimeout(f,60)}else f()}
function nav(){const P=D.profile;return `<header class="nav"><div class="brand" onclick="location.hash=''">${logo}<div><b>${esc(P.name)}</b><small>${esc(P.role)}</small></div></div><nav><a onclick="go('top')">Inicio</a><a onclick="go('proy')">Proyectos</a><a onclick="go('cont')">Contacto</a>${owner?`<a class="pill" onclick="location.hash='panel'">Panel</a>`:''}</nav></header>`}
function foot(){const P=D.profile;return `<footer id="cont"><div class="c fr"><div class="brand">${logo}<div><b>${esc(P.name)}</b><small>${esc(P.role)}</small></div></div><div class="fl"><a href="tel:+34624588098">+34 624 588 098</a><a target="_blank" rel="noopener" href="${esc(P.linkedin)}">LinkedIn</a><a href="mailto:${esc(P.email)}">${esc(P.email)}</a></div><small>© ${new Date().getFullYear()} ${esc(P.name)}</small></div></footer>`}
async function setPhoto(f){if(!assetsApi||!f)return;try{const r=await assetsApi.upload(f);D.profile.photo=r.url;await save()}catch(e){alert('No se pudo subir la foto')}}
function card(p){const im=(p.blocks||[]).find(b=>b.t==='img'),l=(p.links||[])[0];return `<div class="pc" onclick="location.hash='${p.id}'"><div class="th2">${im?`<img src="${esc(im.v)}" alt="">`:''}</div><div class="row"><h3>${esc(p.title)}</h3>${l?`<a class="ex" title="${esc(l.label)}" target="_blank" rel="noopener" href="${esc(safeUrl(l.url))}" onclick="event.stopPropagation()">${ext}</a>`:''}</div><p>${esc(p.summary)}</p><div>${(p.tags||[]).slice(0,4).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}<span class="tag lg">${p.lang==='en'?'EN':'ES'}</span></div></div>`}
function render(){
  const id=location.hash.slice(1),p=D.posts.find(x=>x.id===id),P=D.profile;
  if(id==='panel'&&owner){
    const cnt={};D.posts.forEach(q=>(q.tags||[]).forEach(t=>cnt[t]=(cnt[t]||0)+1));
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,4),tot=top.reduce((s,x)=>s+x[1],0),cols=['#6d4aff','#3b82f6','#a78bfa','#22c1c3'];
    let acc=0;const grad=tot?top.map((x,i)=>{const a=acc/tot*100;acc+=x[1];return `${cols[i]} ${a}% ${acc/tot*100}%`}).join(','):'#e7e4fb 0 100%';
    $('#app').innerHTML=`<div class="panel"><aside><div class="brand" onclick="location.hash=''">${logo}<div><b>${esc(P.name)}</b><small>${esc(P.role)}</small></div></div>
    <a class="on">▦ Panel</a><a onclick="edit()">＋ Crear proyecto</a><a onclick="location.hash=''">↗ Ver mi portafolio</a></aside>
    <main><div class="welcome"><h2>¡Hola, ${esc(P.name.split(' ')[0])}! 👋</h2><p>Gestiona tus proyectos y comparte tu trabajo con el mundo.</p></div>
    <div class="stats"><div class="st"><small>Total de proyectos</small><b>${D.posts.length}</b></div><div class="st"><small>En español</small><b>${D.posts.filter(q=>q.lang!=='en').length}</b></div><div class="st"><small>En inglés</small><b>${D.posts.filter(q=>q.lang==='en').length}</b></div></div>
    <div class="box"><div class="row"><h3>Mis proyectos</h3><button onclick="edit()">＋ Crear proyecto</button></div>
    ${D.posts.length?D.posts.map(q=>{const im=(q.blocks||[]).find(b=>b.t==='img');return `<div class="li"><div class="lt">${im?`<img src="${esc(im.v)}" alt="">`:''}</div><div class="lb"><b>${esc(q.title)}</b><small>${esc(q.summary)}</small></div><span class="tag lg">${q.lang==='en'?'EN':'ES'}</span><button class="g" onclick="location.hash='${q.id}'">Ver</button><button class="g" onclick="edit('${q.id}')">Editar</button><button class="g" onclick="del('${q.id}')">Eliminar</button></div>`}).join(''):'<div class="empty">Aún no tienes proyectos. Crea el primero.</div>'}</div>
    <div class="box"><h3>Tecnologías en tus proyectos</h3><div class="dn"><div class="ring" style="background:conic-gradient(${grad})"></div><div>${top.length?top.map((x,i)=>`<div><i style="background:${cols[i]}"></i>${esc(x[0])} · ${Math.round(x[1]/tot*100)}%</div>`).join(''):'<small>Añade etiquetas a tus proyectos para verlas aquí.</small>'}</div></div></div></main></div>`;return;
  }
  if(p){
    const t=showTr&&tr&&tr.id===p.id?tr:null,en=p.lang==='en';
    $('#app').innerHTML=nav()+`<div class="c post"><div class="bar"><button class="g" onclick="location.hash=''">← Volver</button><div>${owner?`<button class="g" onclick="edit('${p.id}')">Editar</button> <button class="g" onclick="del('${p.id}')">Eliminar</button>`:''}</div></div>
    <article><div>${(p.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><h1>${esc(t?t.title:p.title)}</h1><div class="s">${esc(t?t.summary:p.summary)}</div>
    <div class="lang">🌐 ${t?'Escrito originalmente en inglés · traducción automática al español':lang(p.lang)}${en&&sampleApi?` <button class="g" id="trb" onclick="translate('${p.id}')">${t?'Ver original (inglés)':'Traducir al español'}</button>`:''}</div>
    <div class="links">${(p.links||[]).map(l=>`<a class="btn" target="_blank" rel="noopener" href="${esc(safeUrl(l.url))}">${esc(l.label)} ↗</a>`).join('')}</div>${blocksHtml(p,t)}</article></div>`+foot();return;
  }
  const nm=P.name.split(' '),last=nm.pop(),ini=P.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  $('#app').innerHTML=nav()+`<section class="hero" id="top"><div class="c hg"><div><div class="hi">Hola, soy</div><h1>${esc(nm.join(' '))} <span>${esc(last)}</span></h1><div class="rl">${logo.replace('width="30" height="30"','width="26" height="26"')} ${esc(P.role)}</div><p>${esc(P.lead)}</p>
  <div class="cta"><a class="hp" href="tel:+34624588098">✆&nbsp; +34 624 588 098</a><a class="hp" target="_blank" rel="noopener" href="${esc(P.linkedin)}">in&nbsp; LinkedIn</a><a class="hp" href="mailto:${esc(P.email)}">✉&nbsp; ${esc(P.email)}</a></div></div>
  <div class="ph">${P.photo?`<img src="${esc(P.photo)}" alt="${esc(P.name)}">`:`<div class="ini">${esc(ini)}</div>`}${owner?`<label class="hp chg">Cambiar foto<input type="file" accept="image/*" hidden onchange="setPhoto(this.files[0])"></label>`:''}</div></div></section>
  <div class="c two"><div class="ib"><h3>Experiencia</h3><b class="big">+3 años</b>${P.exp.map(e=>`<div class="ln"><b>${esc(e.role)}</b><small>${esc(e.org)} · ${esc(e.when)}</small></div>`).join('')}</div>
  <div class="ib"><h3>Educación</h3>${P.edu.map(e=>`<div class="ln"><b class="ed">${esc(e.title)}</b><small>${esc(e.org)} · ${esc(e.when)}</small></div>`).join('')}</div></div>
  <div class="c" id="proy"><div class="row ph2"><div><h2>Mis Proyectos</h2><p class="mu">Explora mis trabajos y descubre cómo convierto los datos en soluciones.</p></div>${owner?'<button onclick="edit()">＋ Nuevo proyecto</button>':''}</div>
  ${D.posts.length?`<div class="grid">${D.posts.map(card).join('')}</div>`:`<div class="empty">Próximamente: mis proyectos de análisis de datos.${owner?' Pulsa “Nuevo proyecto” para subir el primero.':''}</div>`}</div>`+foot();
}
async function translate(id){
  if(tr&&tr.id===id){showTr=!showTr;render();return}
  const p=D.posts.find(x=>x.id===id),b=$('#trb');b.textContent='Traduciendo…';b.disabled=true;
  const texts=(p.blocks||[]).map(x=>x.t==='text'?x.v:'');
  try{
    const r=await sampleApi.json(`Traduce del inglés al español natural y profesional este análisis de datos. Conserva los términos técnicos (Power BI, SQL, DAX, ETL, etc.), los saltos de línea y los subtítulos que empiezan con “## ”. Responde SOLO con JSON: {"title":"","summary":"","blocks":[...]} donde blocks tiene exactamente ${texts.length} cadenas en el mismo orden (cadena vacía si el original está vacío).\n`+JSON.stringify({title:p.title,summary:p.summary,blocks:texts}));
    tr={id,title:r.title,summary:r.summary,blocks:r.blocks};showTr=true;
  }catch(e){alert('No se pudo traducir ahora.')}
  render();
}
async function save(){
  if(!pubApi){alert('No se puede guardar desde esta vista.');return false}
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';c.querySelector('#dlg').innerHTML='';c.querySelector('#dlg').removeAttribute('open');
  c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  try{await pubApi.publish('<!doctype html>\n'+c.outerHTML);return true}catch(e){alert('No se pudo guardar: '+(e.code||e.message));return false}
}
let draft;
function edit(id){
  const p=D.posts.find(x=>x.id===id)||{id:'p'+Date.now().toString(36),title:'',summary:'',tags:[],lang:'es',blocks:[{t:'text',v:''}],links:[]};
  draft=JSON.parse(JSON.stringify(p));if(!draft.blocks)draft.blocks=[{t:'text',v:draft.body||''}];
  $('#dlg').innerHTML=`<h3>${id?'Editar':'Nuevo'} proyecto</h3>
  <label>Título</label><input id="f_t" value="${esc(draft.title)}">
  <label>Resumen (1–2 frases)</label><input id="f_s" value="${esc(draft.summary)}">
  <label>Etiquetas (separadas por coma)</label><input id="f_g" value="${esc(draft.tags.join(', '))}">
  <label>Idioma en que escribiste el análisis</label><select id="f_i"><option value="es" ${draft.lang==='es'?'selected':''}>Español</option><option value="en" ${draft.lang==='en'?'selected':''}>Inglés</option></select>
  <label>Enlaces (uno por línea: Texto | https://url)</label><textarea id="f_l">${esc((draft.links||[]).map(l=>l.label+' | '+l.url).join('\n'))}</textarea>
  <label>Contenido paso a paso: añade bloques de texto e imágenes en el orden que quieras</label><div id="bl"></div>
  <div style="display:flex;gap:8px;margin-top:10px"><button class="g" onclick="addT()">+ Texto</button><button class="g" onclick="$('#f_f').click()">+ Imagen</button><input type="file" id="f_f" accept="image/*" multiple hidden></div>
  <p style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px"><button class="g" onclick="$('#dlg').close()">Cancelar</button><button id="sv" onclick="commit()">Guardar y publicar</button></p>`;
  blocks();$('#dlg').showModal();
  $('#f_f').onchange=async e=>{
    if(!assetsApi){alert('La subida de imágenes no está disponible.');return}
    for(const f of e.target.files){try{const r=await assetsApi.upload(f);draft.blocks.push({t:'img',v:r.url,cap:''});blocks()}catch(x){alert('Error al subir '+f.name)}}
    e.target.value='';
  };
}
function addT(){draft.blocks.push({t:'text',v:''});blocks()}
function mv(i,d){const j=i+d;if(j<0||j>=draft.blocks.length)return;[draft.blocks[i],draft.blocks[j]]=[draft.blocks[j],draft.blocks[i]];blocks()}
function blocks(){
  $('#bl').innerHTML=draft.blocks.map((b,i)=>`<div class="blk"><div class="ctl"><button class="g" onclick="mv(${i},-1)">↑</button><button class="g" onclick="mv(${i},1)">↓</button><button class="g" onclick="draft.blocks.splice(${i},1);blocks()">✕</button></div>
  ${b.t==='img'?`<img src="${esc(b.v)}" alt=""><input placeholder="Pie de imagen (opcional)" value="${esc(b.cap||'')}" oninput="draft.blocks[${i}].cap=this.value">`:`<textarea placeholder="Explica este paso… (usa “## ” para un subtítulo)" oninput="draft.blocks[${i}].v=this.value">${esc(b.v)}</textarea>`}</div>`).join('');
}
async function commit(){
  if(busy)return;busy=true;
  draft.title=$('#f_t').value.trim();draft.summary=$('#f_s').value.trim();draft.lang=$('#f_i').value;
  draft.tags=$('#f_g').value.split(',').map(s=>s.trim()).filter(Boolean);
  draft.links=$('#f_l').value.split('\n').map(l=>{const [a,...b]=l.split('|');return b.length?{label:a.trim(),url:b.join('|').trim()}:null}).filter(Boolean);
  delete draft.body;
  if(!draft.title){alert('Pon un título');busy=false;return}
  const i=D.posts.findIndex(x=>x.id===draft.id);i>=0?D.posts[i]=draft:D.posts.unshift(draft);
  $('#sv').textContent='Publicando…';await save();busy=false;
}
async function del(id){if(!confirm('¿Eliminar este proyecto?'))return;D.posts=D.posts.filter(x=>x.id!==id);location.hash='';await save()}
window.addEventListener('hashchange',render);render();
(async()=>{
  try{const u=await claude.use('user');owner=!!(u&&(u.isOwner()||u.canEdit()));}catch(e){}
  try{sampleApi=await claude.use('sample')}catch(e){}
  if(owner){try{assetsApi=await claude.use('assets')}catch(e){}try{pubApi=await claude.use('artifact')}catch(e){}}
  render();
})();
</script></body></html>
